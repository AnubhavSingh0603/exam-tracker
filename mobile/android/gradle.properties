# Sized for an 8 GB PC (the template's -Xmx8G would claim all of its RAM).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project is on D: but the pub cache (plugin sources) is on C:. Kotlin's incremental
# cache can't relativize paths across drives on Windows ("different roots"), so disable it.
kotlin.incremental=false
