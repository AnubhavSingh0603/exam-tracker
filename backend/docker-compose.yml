services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tuned for the 1 GB AMD micro shape; harmless on Ampere A1.
    command: >
      postgres -c shared_buffers=128MB -c max_connections=30
               -c work_mem=4MB -c effective_cache_size=384MB

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - notifications:/data/notifications
    # Bound to loopback: put Caddy/nginx in front for TLS, don't expose 8000 publicly.
    # Local dev. To reach it from a phone on the same Wi-Fi, start with
    #   API_BIND=0.0.0.0 docker compose up -d
    # (and allow TCP 8000 in the Windows/macOS firewall). Never do this on the VM.
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"

  # Scrapers + Gemini ingestion queue. Same image, different entrypoint.
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      api:
        condition: service_healthy  # the API creates the schema
    volumes:
      - notifications:/data/notifications
    healthcheck:
      disable: true
    # Chromium (if enabled) needs a bigger /dev/shm than Docker's 64 MB default.
    shm_size: "256mb"

volumes:
  pgdata:
  notifications:
