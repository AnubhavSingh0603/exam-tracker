# Production stack for one OCI Always-Free VM (Ampere A1 arm64 or AMD micro).
#   docker compose -f docker-compose.prod.yml up -d --build
# First run: ./init-letsencrypt.sh  (gets the TLS certificate, then starts everything)
#
# No Redis/Celery: the worker uses APScheduler + a Postgres advisory lock, and nothing
# in the app needs a broker or cache. Leaving Redis out saves ~50-100 MB of RAM, which
# matters on the 1 GB AMD shape. Add it only when something actually uses it.

name: exam-tracker

x-app: &app
  build: .
  image: exam-tracker-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    FIREBASE_CREDENTIALS_FILE: /run/secrets/firebase-service-account.json
    RELEASE_MANIFEST_PATH: /data/releases/latest.json
  volumes:
    - notifications:/data/notifications
    - ./releases:/data/releases:ro
    # Put firebase-service-account.json here (chmod 600). Missing file = push disabled.
    - ./secrets:/run/secrets:ro
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    command: >
      postgres -c shared_buffers=128MB -c max_connections=30
               -c work_mem=4MB -c effective_cache_size=384MB
    logging: *logging

  api:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
    expose: ["8000"]  # reachable only through nginx
    # Healthcheck comes from the Dockerfile (GET /healthz incl. a DB round-trip).

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      api: { condition: service_healthy }  # the API creates the schema
    shm_size: "256mb"  # only matters if Playwright is enabled
    healthcheck:
      # Leader heartbeat file is touched every 5 min; stale > 15 min = unhealthy.
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 900 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # *.template files are rendered with envsubst into /etc/nginx/conf.d at start-up.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./downloads:/srv/downloads:ro
    # Reload every 6 h so renewed certificates are picked up without downtime.
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
                  exec /docker-entrypoint.sh nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Twice a day; certbot only renews certificates within 30 days of expiry.
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet;
                  sleep 12h & wait $${!}; done'
    logging: *logging

volumes:
  pgdata:
  notifications:
